[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bioheal"
version = "0.1.0"
description = "Experimental, open-source framework for verified software recovery: detect, diagnose, select an approved strategy, verify, and roll back."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Marcelo Bayon", email = "Marcelo.Bayon1987@gmail.com" }]
keywords = ["resilience", "self-healing", "recovery", "fault-tolerance", "circuit-breaker", "verification"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries",
  "Typing :: Typed",
]
dependencies = []  # standard library only

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.4", "mypy>=1.8"]

[project.urls]
Homepage = "https://github.com/marcelobayon/BioHeal"
Repository = "https://github.com/marcelobayon/BioHeal"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
bioheal = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/bioheal"]
